<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday Radhika Di 🎂💖</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Poppins:wght@400;500;600;700;800&family=Caveat:wght@500;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>
<body class="landing-page">
  <div class="rangoli rangoli-left"></div>
  <div class="rangoli rangoli-right"></div>

  <div class="particles">
    <span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span>
  </div>

  <main class="hero">
    <p class="handwritten">For the best sister in the world</p>

    <h1>Happy Birthday, Radhika Di 🎂💖</h1>

    <p class="subtitle">
      A small surprise from your little brother <strong>Priyesh</strong>
    </p>

    <div class="cake-wrapper">
      <div class="cake-glow"></div>

      <div class="cake-container" id="cakeContainer" aria-label="Birthday Cake" role="button" tabindex="0">
        <div class="cake-shadow"></div>

        <div class="candle">
          <div class="flame" id="flame"></div>
        </div>

        <div class="cake cake-top">
          <div class="frosting-drip drip-1"></div>
          <div class="frosting-drip drip-2"></div>
          <div class="frosting-drip drip-3"></div>
        </div>

        <div class="cake cake-middle">
          <div class="frosting-drip drip-4"></div>
          <div class="frosting-drip drip-5"></div>
        </div>

        <div class="cake cake-bottom">
          <div class="cake-board"></div>
        </div>
      </div>
    </div>

    <p class="cake-note">✨ Tap the cake to begin the surprise ✨</p>

    <div class="wish-message hidden" id="wishMessage">
      Make a wish, Radhika Di… ✨
    </div>

    <div class="confetti-container" id="confettiContainer"></div>
    <div class="hearts-container" id="heartsContainer"></div>

    <audio id="bdaySong" src="birthday.mp3" preload="auto"></audio>
  </main>

  <script src="script.js"></script>
</body>
</html>
